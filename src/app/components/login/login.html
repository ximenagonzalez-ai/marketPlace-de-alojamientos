<div class="container my-5" style="max-width: 450px;">
  <div class="card shadow-sm p-4 border-0 rounded-4">
    <h3 class="text-center mb-4 fw-bold">Iniciar Sesión / Registro</h3>
    <form (ngSubmit)="onRegister()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nombre completo</label>
        <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" required placeholder="Tu nombre">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required placeholder="correo@ejemplo.com">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="clave" name="clave" required placeholder="******">
      </div>
      <button type="submit" class="btn btn-dark w-100 mt-2 py-2 fw-semibold">Ingresar</button>
    </form>
  </div>
</div>
