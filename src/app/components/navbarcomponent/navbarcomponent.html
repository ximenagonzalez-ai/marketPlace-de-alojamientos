<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand fw-bold" routerLink="/">
      StayHome
    </a>

    <!-- Botón para celular -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarPrincipal"
      aria-controls="navbarPrincipal"
      aria-expanded="false"
      aria-label="Mostrar navegación">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Opciones -->
    <div class="collapse navbar-collapse" id="navbarPrincipal">

      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/home"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}">
            Inicio
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/alojamientos"
            routerLinkActive="active">
            Alojamientos
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/reserva"
            routerLinkActive="active">
            Mis reservas
          </a>
        </li>
      </ul>

      <!-- Sección Derecha: Usuario activo o Botón de Login -->
      <div class="d-flex align-items-center gap-3">
        <ng-container *ngIf="usuarioActual; else noSesion">
          <span class="fw-semibold text-dark">👤 {{ usuarioActual.nombre }}</span>
          <button class="btn btn-outline-danger btn-sm" (click)="logout()">Cerrar sesión</button>
        </ng-container>

        <ng-template #noSesion>
          <!-- Usamos routerLink en lugar de href para navegación interna de Angular -->
          <a routerLink="/login" class="btn btn-outline-dark btn-sm">
            Iniciar sesión
          </a>
        </ng-template>

        <a
          routerLink="/alojamientos"
          class="btn btn-dark">
          Buscar alojamiento
        </a>
      </div>

    </div>

  </div>
</nav>
